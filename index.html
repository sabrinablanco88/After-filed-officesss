<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After Office - Votación</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f8fafc; padding: 16px; padding-bottom: 60px; }
    .card { background: #151d30; border: 1px solid #2d3b5e; border-radius: 20px; padding: 18px; margin-bottom: 16px; text-align: center; }
    .badge-date { background: rgba(99, 102, 241, 0.2); border: 2px solid #818cf8; padding: 6px 14px; border-radius: 999px; display: inline-block; margin-bottom: 12px; }
    .badge-date p:first-child { font-size: 11px; font-weight: 700; color: #c7d2fe; letter-spacing: 1px; }
    .badge-date p:last-child { font-size: 15px; font-weight: 900; color: #ffffff; }
    h1 { font-size: 22px; font-weight: 900; background: linear-gradient(90deg, #f472b6, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 6px; }
    .gold-box { background: rgba(245, 158, 11, 0.15); border: 2px solid #fbbf24; border-radius: 16px; padding: 14px; margin-bottom: 16px; text-align: center; }
    .gold-box h2 { color: #fde047; font-size: 13px; font-weight: 900; letter-spacing: 0.5px; margin-bottom: 4px; }
    .gold-box p { color: #ffffff; font-size: 15px; font-weight: 900; }
    .gold-box span { color: #94a3b8; font-size: 11px; display: block; margin-top: 4px; }
    /* TABLERO DE JUEGO */
    .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 15px 0; background: #070a12; padding: 12px; border-radius: 16px; border: 1px solid #1e293b; }
    .hole { height: 75px; background: #111827; border-radius: 12px; border: 1px dashed #374151; display: flex; align-items: center; justify-content: center; }
    .beer-btn { width: 100%; height: 100%; font-size: 32px; background: #be185d; border: 2px solid #f472b6; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .score-txt { font-size: 18px; font-weight: 900; color: #fbbf24; }
    /* FORMULARIO */
    .form-group { text-align: left; margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 5px; }
    input, select { width: 100%; padding: 12px; background: #070a12; border: 1px solid #334155; border-radius: 10px; color: white; font-size: 15px; outline: none; }
    .btn-ws { width: 100%; padding: 15px; background: #10b981; border: none; border-radius: 12px; color: white; font-size: 15px; font-weight: 900; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <!-- CABECERA -->
  <div class="card">
    <div class="badge-date">
      <p>FECHA CONFIRMADA</p>
      <p>🗓️ VIERNES 27 DE NOVIEMBRE</p>
    </div>
    <h1>Se pica el after: ¿A dónde vamos?</h1>
  </div>

  <!-- SHOW PALOMAS Y ENANOS -->
  <div class="gold-box">
    <h2>🚨 CLÁUSULA CONTRACTUAL EXCLUSIVA 🚨</h2>
    <p>🕊️ INCLUYE SHOW DE ENANOS Y PALOMAS EN VIVO 🕺</p>
    <span>(Sujeto a disponibilidad, presupuesto y aprobación)</span>
  </div>

  <!-- JUEGO INTERACTIVO NATIVO -->
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:13px; font-weight:700; color:#f472b6;">Atrapá la Birra</span>
      <span class="score-txt" id="score">Puntos: 0</span>
    </div>
    <p style="font-size:12px; color:#94a3b8; margin-top:4px;">Tocá la jarra cuando aparezca:</p>

    <!-- Grilla del juego -->
    <div class="game-grid" id="grid">
      <div class="hole" id="h0"></div>
      <div class="hole" id="h1"></div>
      <div class="hole" id="h2"></div>
      <div class="hole" id="h3"></div>
      <div class="hole" id="h4"><button class="beer-btn" id="beer" onclick="catchBeer()">🍻</button></div>
      <div class="hole" id="h5"></div>
    </div>

    <button onclick="resetGame()" style="background:none; border:none; color:#64748b; font-size:12px; text-decoration:underline; cursor:pointer;">
      Reiniciar puntaje
    </button>
  </div>

  <!-- VOTACIÓN -->
  <div class="card">
